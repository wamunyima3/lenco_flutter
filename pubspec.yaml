name: lenco_flutter
description: A production-ready Flutter package for integrating Lenco payment gateway. Support for accounts, transactions, payments, collections, virtual accounts, and mobile money.
version: 2.1.0
homepage: https://lenco-api.readme.io
repository: https://github.com/wamunyima3/lenco_flutter
issue_tracker: https://github.com/wamunyima3/lenco_flutter/issues
documentation: https://lenco-api.readme.io/v2.0/reference/introduction

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  meta: ^1.9.1
  equatable: ^2.0.5
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.6
  json_serializable: ^6.7.1
  mockito: ^5.4.2
  test: ^1.24.0

topics:
  - payment
  - gateway
  - lenco
  - fintech
  - api

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:
